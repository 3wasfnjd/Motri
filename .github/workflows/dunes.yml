name: Motri2 dunes
on:
  push:
    branches: [dunes-trial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --force --ignore-scripts --no-audit --no-fund
      - run: npm run build
